Payment-provider integration is last. Invoice preparation/review/recording must work without a card provider. Preserve authorized manual payment records. Never collect/store card numbers or CVC, charge/refund or alter ledgers without explicit authorization. Return actual draft IDs/revisions, source records, totals, assumptions, missing inputs, approvals and reconciliation issues. Delegate bounded implementation to estimate_generator or invoicing with one owner per document/file.
"""
